<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alisha Books — Find Your Genre</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="logo">Alisha Books</h1>
      <nav class="nav">
        <button id="start-quiz" class="btn">Take the Quiz</button>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    <section class="hero">
      <h2>Not sure what to read next?</h2>
      <p>Take a short quiz to discover the book genres you’ll love and get recommendations — including "Alisha's pick" for each genre with a short review.</p>
      <button id="hero-start" class="btn primary">Find My Genre</button>
    </section>

    <section id="quiz-section" class="quiz hidden" aria-hidden="true">
      <div class="quiz-card">
        <div class="quiz-header">
          <div id="progress" class="progress"><div id="progress-bar" style="width:0%"></div></div>
          <h3 id="question-title"></h3>
        </div>

        <ul id="options" class="options" role="list"></ul>

        <div class="quiz-footer">
          <button id="prev" class="btn">Back</button>
          <button id="next" class="btn primary">Next</button>
        </div>
      </div>
    </section>

    <section id="result-section" class="result hidden" aria-hidden="true">
      <div class="result-card">
        <h2>Your top genre: <span id="genre-name"></span></h2>
        <p id="genre-desc"></p>

        <h3>Alisha's pick</h3>
        <div class="alisha-pick">
          <h4 id="pick-title"></h4>
          <p id="pick-review"></p>
        </div>

        <h3>Recommended books</h3>
        <ul id="book-list" class="book-list"></ul>
        <div class="result-actions">
          <button id="retake" class="btn">Retake Quiz</button>
          <button id="explore" class="btn primary">Explore More</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">© Alisha Books</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
